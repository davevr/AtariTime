AtariTime project configuration for the Atari800 emulator
# A stock NTSC Atari 800 with 48K, running the Altirra replacement OS that
# is built into the emulator.  No ROM files are named here on purpose.
MACHINE_TYPE=Atari 400/800
RAM_SIZE=48
DEFAULT_TV_MODE=NTSC
OS_400/800_VERSION=ALTIRRA
BASIC_VERSION=ALTIRRA
DISABLE_BASIC=1
VIDEOMODE_WINDOWED=1
VIDEOMODE_WINDOW_WIDTH=672
VIDEOMODE_WINDOW_HEIGHT=480
# Joystick 1 from the keyboard: W A S D to move, left Control to fire.
# (The emulator's first choice is the numeric keypad, which a laptop lacks.)
SDL2_JOY_PORT_0_MODE=2
SDL2_JOY_PORT_1_MODE=0
